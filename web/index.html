  <!DOCTYPE html>
  <html>
  <head>
  <meta charset="UTF-8">
  <title>조도 모니터</title>
  <script src="https://unpkg.com/chart.js"></script>
  </head>
  <body style="background:#1a1a1a;color:#fff;text-align:center">
  <h1>조도 실시간 모니터</h1>
  <p id="status">시작...</p>
  <div id="value" style="font-size:48px;color:#ffcc00">-</div>
  <canvas id="chart" width="600" height="300"></canvas>
  <script>
  const cv = document.getElementById('chart');
  const sEl = document.getElementById('status');
  const vEl = document.getElementById('value');
  const labels = [];
  const data = [];
  const chart = new Chart(cv.getContext('2d'), {
    type: 'line',
    data: { labels: labels, datasets: [{
      label: '조도값',
      data: data,
      borderColor: '#ffcc00',
      tension: 0.3
    }]},
    options: {
      animation: false,
      scales: { y: { min: 0, max: 255 } }
    }
  });
  async function poll() {
    try {
      const res = await fetch('/light');
      const r = await res.json();
      if (r.ok && r.cmd === 'LIGHT') {
        sEl.textContent = '연결됨';
        vEl.textContent = r.data.value;
        labels.push(new Date().toLocaleTimeString());
        data.push(r.data.value);
        if (labels.length > 30) {
          labels.shift();
          data.shift();
        }
        chart.update();
      }
    } catch (e) {
      sEl.textContent = '연결 안됨';
    }
  }
  setInterval(poll, 1000);
  </script>
  </body>
  </html>
